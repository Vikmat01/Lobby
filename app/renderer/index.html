<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>Lobby</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-glow"></div>
  <div class="sp-mark">
    <svg viewBox="0 0 512 512" width="220" height="220">
      <defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sp-s1"/><stop offset="1" class="sp-s2"/></linearGradient></defs>
      <rect class="sp-v" x="128" y="104" width="112" height="304" rx="28" fill="url(#spg)"/>
      <rect class="sp-h" x="128" y="296" width="256" height="112" rx="28" fill="url(#spg)"/>
      <rect class="sp-t" x="272" y="104" width="112" height="160" rx="28" fill="#1E1E1E"/>
      <path class="sp-p" d="M310 152 L350 184 L310 216 Z" fill="#EDEDED"/>
    </svg>
    <div class="sp-word">Lobby</div>
  </div>
</div>
<div id="stage">
  <div id="hero-art" aria-hidden="true"><div class="hero-img"></div><div class="hero-img next"></div></div>

  <header id="topbar">
    <button class="profile" id="profile" data-nav data-row="top" aria-label="Профиль и Game Bro">
      <span class="avatar" id="avatar">И</span>
      <span class="profile-text">
        <span class="profile-top"><span class="profile-name" id="profile-name">Игрок</span><span class="lvl-pill" id="lvl-pill">LV 1</span></span>
        <span class="xp-row"><span class="xp-bar"><span id="xp-fill"></span></span><span class="xp-text" id="xp-text">0 / 100 XP</span></span>
      </span>
    </button>
    <nav id="tabs" aria-label="Разделы"></nav>
    <div class="status">
      <span class="playing-pill" id="playing-pill" hidden></span>
      <span class="playing-pill dl-pill" id="dl-pill" hidden></span>
      <button class="round" id="btn-search" aria-label="Поиск" data-nav data-row="top">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <button class="round" id="btn-settings" aria-label="Настройки" data-nav data-row="top">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <span class="pad-bat" id="pad-bat" hidden></span>
      <span class="pad-state" id="pad-state" title="Геймпад">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3h14a6 6 0 0 1 6 6.5l-.7 6.2A3.6 3.6 0 0 1 21 17.4L18.6 14h-7.2L9 17.4a3.6 3.6 0 0 1-6.3-1.7L2 9.5A6 6 0 0 1 8 3z"/><path d="M8 7.5v4M6 9.5h4"/><circle cx="21" cy="8" r="1" fill="currentColor"/><circle cx="23" cy="11" r="1" fill="currentColor"/></svg>
      </span>
      <span class="clock" id="clock">00:00</span>
    </div>
  </header>

  <main id="views">
    <section id="view-home" class="view"></section>
    <section id="view-library" class="view" hidden></section>
    <section id="view-trophies" class="view" hidden></section>
  </main>

  <div id="layers"></div>
  <div id="toasts" aria-live="polite"></div>

  <footer id="hints"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
